[project]
name = "streamlit-session-memo"
description = ""
authors = [{ name = "Yuichiro Tachibana (Tsuchiya)", email = "t.yic.yt@gmail.com" }]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
dynamic = ["version"]
dependencies = [
    # 1.25.0 is the floor for `_make_value_key()`'s current signature, which
    # `calc_cache_key()` calls.
    "streamlit>=1.25.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "mypy[faster-cache]>=1.15.0",
    "pytest>=7.3.1,<8",
    "streamlit>=1.25.0",
    "pre-commit>=4.2.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.ruff.lint]
extend-select = ["I"]

[tool.scriv]
categories = ["Added", "Changed", "Deprecated", "Removed", "Fixed", "Security", "Chore"]
format = "md"
md_header_level = 2

[tool.scriv-release]
# There is deliberately no [tool.bumpversion] section: with none configured,
# bump-my-version reads the current version from the latest Git tag and edits no
# files, which is what this hatch-vcs project wants. The tag is the only artifact.
version_provider = "bump-my-version"
